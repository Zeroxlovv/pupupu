version: '3.8'

services:
  timetable:
    build: .
    ports:
      - "80:80"
    restart: unless-stopped
    container_name: vsuet-timetable
    environment:
      - TZ=Europe/Moscow
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
